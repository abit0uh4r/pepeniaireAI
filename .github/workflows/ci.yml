name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_DATABASE: pepiniere_ia_test
          MYSQL_USER: pepiniere
          MYSQL_PASSWORD: ci-database-password
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: pepiniere_ia_test
      DB_USERNAME: pepiniere
      DB_PASSWORD: ci-database-password
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MANAGER_NAME: CI Manager
      MANAGER_EMAIL: manager-ci@example.test
      MANAGER_PASSWORD: ci-manager-password

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository hygiene
        shell: bash
        run: |
          git diff --check
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo ".env must not be tracked"
            exit 1
          fi
          if git grep -n -E 'gsk_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}' -- . ':!package-lock.json'; then
            echo "A credential-like value was found in tracked files"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: bcmath, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Configure application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Audit Composer dependencies
        run: composer audit --no-interaction --locked

      - name: Migrate and seed
        run: php artisan migrate:fresh --seed --force

      - name: Run tests
        run: php artisan test

      - name: Check formatting
        run: vendor/bin/pint --test
